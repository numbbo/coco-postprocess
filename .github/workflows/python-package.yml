name: Python package
on:
  push:
  #   branches: [ "main" ]
  pull_request:
  #   branches: [ "main" ]
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
    - uses: actions/checkout@v7
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install build --group dev  # ruff, pytest
    - name: Lint with ruff
      run: ruff check src tests
    - name: Build wheel
      # cocopp is pure python: the wheel is the same py3-none-any wheel for all versions
      run: python -m build --wheel -o dist .
    - name: Install package from wheel
      run: pip install dist/*.whl
    - name: Run tests
      run: pytest tests  # offline, including the full pipeline and snapshot tests, takes about 10 minutes
    - name: Run tests using the online data archives
      # the doctests, the archives, and the former default scenarios of python -m cocopp.test
      run: pytest tests/network --run-network -k "not legacy"
    # - name: Run all tests using the online data archives
    #   run: pytest tests/network --run-network  # takes about 30 minutes
    - name: Upload wheel
      uses: actions/upload-artifact@v4
      with:
        name: wheel-python-${{ matrix.python-version }}
        path: dist/*.whl
