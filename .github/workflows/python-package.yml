name: Python package
on:
  push:
  #   branches: [ "main" ]
  pull_request:
  #   branches: [ "main" ]
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v3
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install ruff pytest
    - name: Lint with ruff
      run: ruff check src tests
    - name: Install package
      run: pip install .
    - name: Run tests
      run: pytest tests  # offline, including the full pipeline and snapshot tests, takes about 10 minutes
    - name: Run tests using the online data archives
      # the doctests, the archives, and the former default scenarios of python -m cocopp.test
      run: pytest tests/network --run-network -k "not legacy"
    # - name: Run all tests using the online data archives
    #   run: pytest tests/network --run-network  # takes about 30 minutes
